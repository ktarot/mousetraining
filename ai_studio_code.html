<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시니어 마우스 & 키보드 마스터</title>
    <style>
        :root {
            --desktop-bg: #0078d7;
            --folder-color: #ffca28;
            --file-color: #ffffff;
            --success-color: #2ecc71;
            --sidebar-width: 280px;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            height: 100%; overflow: hidden;
            background-color: #2c3e50;
        }

        .app-container {
            display: flex;
            height: 100vh;
        }

        /* 사이드바 메뉴 */
        nav {
            width: var(--sidebar-width);
            background: #34495e;
            color: white;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 2px 0 10px rgba(0,0,0,0.3);
            z-index: 100;
        }

        nav h2 { font-size: 20px; border-bottom: 2px solid #5d6d7e; padding-bottom: 10px; color: #ecf0f1; }
        .menu-btn {
            display: block; width: 100%; padding: 12px; margin: 8px 0;
            background: #5d6d7e; color: white; border: none; border-radius: 5px;
            text-align: left; font-size: 16px; cursor: pointer; transition: 0.2s;
        }
        .menu-btn:hover { background: #3498db; }
        .menu-btn.active { background: #3498db; font-weight: bold; box-shadow: inset 0 0 5px rgba(0,0,0,0.5); }

        /* 메인 연습 영역 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        #instruction {
            background: #f1c40f; color: #2c3e50;
            padding: 15px 30px; font-size: 20px; font-weight: bold;
            width: 100%; text-align: center; box-sizing: border-box;
        }

        /* 가상 바탕화면 (1024x768 비율 기반) */
        #desktop {
            width: 1024px;
            height: 768px;
            background-color: var(--desktop-bg);
            position: relative;
            margin: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            overflow: hidden;
            transform-origin: center;
        }

        /* 아이콘 공통 */
        .icon {
            position: absolute;
            width: 80px; height: 90px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; user-select: none;
            border: 2px solid transparent;
            transition: background 0.2s;
        }
        .icon:hover { background: rgba(255,255,255,0.2); }
        .icon.selected { background: rgba(255,255,255,0.4); border: 2px solid #fff; }
        .icon-img { font-size: 40px; margin-bottom: 5px; position: relative; }
        .icon-name { color: white; font-size: 14px; text-shadow: 1px 1px 2px #000; text-align: center; }

        /* 바로가기 화살표 */
        .shortcut-badge::after {
            content: '⤴'; position: absolute; left: 0; bottom: 0;
            background: white; color: blue; font-size: 12px; font-weight: bold;
            border: 1px solid #000; padding: 0 2px;
        }

        /* 스크롤/확대 연습용 화면 */
        #text-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; display: none; overflow-y: auto; padding: 40px; box-sizing: border-box;
        }

        /* 키보드 상태 표시 */
        #key-status {
            position: absolute; bottom: 30px; right: 30px; display: flex; gap: 10px;
        }
        .key { padding: 10px 20px; background: #95a5a6; color: white; border-radius: 5px; font-weight: bold; opacity: 0.3; }
        .key.active { opacity: 1; background: #e74c3c; transform: translateY(-5px); }

        /* 성공 알림 */
        #success-msg {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(46, 204, 113, 0.95); color: white;
            padding: 40px 80px; border-radius: 100px; font-size: 40px; font-weight: bold;
            display: none; z-index: 1000; box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            pointer-events: none;
        }

        /* 드래그 영역 선택 박스 */
        #selection-box {
            position: absolute; border: 1px solid #fff; background: rgba(52, 152, 219, 0.3); display: none; pointer-events: none;
        }

        /* 우클릭 메뉴 */
        #context-menu {
            position: absolute; background: #eee; border: 1px solid #aaa; box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            display: none; z-index: 1001; padding: 5px 0; min-width: 150px;
        }
        .menu-item { padding: 10px 20px; cursor: pointer; color: #333; }
        .menu-item:hover { background: #3498db; color: white; }
    </style>
</head>
<body>

<div class="app-container">
    <nav>
        <h2>🖱️ 마우스 연습 메뉴</h2>
        <button class="menu-btn" onclick="setMode('click')">좌클릭 연습</button>
        <button class="menu-btn" onclick="setMode('double')">더블 클릭 연습</button>
        <button class="menu-btn" onclick="setMode('right')">우클릭 연습</button>
        <button class="menu-btn" onclick="setMode('drag')">드래그 앤 드롭</button>
        <button class="menu-btn" onclick="setMode('scroll')">스크롤 내리기</button>
        
        <h2>⌨️ 키보드 조합</h2>
        <button class="menu-btn" onclick="setMode('ctrl-click')">Ctrl + 클릭 (다중)</button>
        <button class="menu-btn" onclick="setMode('shift-click')">Shift + 클릭 (범위)</button>
        <button class="menu-btn" onclick="setMode('ctrl-drag')">Ctrl + 드래그 (선택)</button>
        <button class="menu-btn" onclick="setMode('alt-drag')">Alt + 드래그 (바로가기)</button>
        <button class="menu-btn" onclick="setMode('ctrl-wheel')">Ctrl + 휠 (확대/축소)</button>
    </nav>

    <main>
        <div id="instruction">왼쪽 메뉴를 선택하여 연습을 시작하세요!</div>
        
        <div id="desktop">
            <!-- 아이콘들이 생성되는 곳 -->
            <div id="text-screen"></div>
            <div id="selection-box"></div>
        </div>

        <div id="key-status">
            <div id="key-ctrl" class="key">Ctrl</div>
            <div id="key-shift" class="key">Shift</div>
            <div id="key-alt" class="key">Alt</div>
        </div>

        <div id="success-msg">참 잘하셨습니다! 👍</div>
    </main>
</div>

<!-- 우클릭 메뉴 -->
<div id="context-menu">
    <div class="menu-item" onclick="onMenuClick()">열기</div>
    <div class="menu-item" onclick="onMenuClick()">복사</div>
    <div class="menu-item" onclick="onMenuClick()">이름 바꾸기</div>
    <div class="menu-item" onclick="onMenuClick()">삭제</div>
</div>

<script>
    const desktop = document.getElementById('desktop');
    const textScreen = document.getElementById('text-screen');
    const instruction = document.getElementById('instruction');
    const successMsg = document.getElementById('success-msg');
    const contextMenu = document.getElementById('context-menu');
    const selectionBox = document.getElementById('selection-box');

    let currentMode = '';
    let selectedIcons = new Set();
    let keys = { ctrl: false, shift: false, alt: false };
    let zoomLevel = 1.0;

    // 초기 해상도 대응 (반응형 축소)
    function fitDesktop() {
        const scale = Math.min((window.innerWidth - 320) / 1024, (window.innerHeight - 100) / 768);
        if (scale < 1) desktop.style.transform = `scale(${scale})`;
        else desktop.style.transform = `scale(1)`;
    }
    window.addEventListener('resize', fitDesktop);
    fitDesktop();

    // 키보드 상태 감지
    window.addEventListener('keydown', (e) => toggleKey(e, true));
    window.addEventListener('keyup', (e) => toggleKey(e, false));

    function toggleKey(e, isPressed) {
        if (e.key === 'Control') { keys.ctrl = isPressed; document.getElementById('key-ctrl').classList.toggle('active', isPressed); }
        if (e.key === 'Shift') { keys.shift = isPressed; document.getElementById('key-shift').classList.toggle('active', isPressed); }
        if (e.key === 'Alt') { keys.alt = isPressed; document.getElementById('key-alt').classList.toggle('active', isPressed); }
    }

    // 아이콘 생성
    function createIcons() {
        desktop.innerHTML = '<div id="text-screen"></div><div id="selection-box"></div>';
        const icons = [
            ...Array(4).fill({type: 'folder', img: '📁'}),
            ...Array(9).fill({type: 'file', img: '📄'})
        ];

        icons.forEach((data, i) => {
            const div = document.createElement('div');
            div.className = `icon ${data.type}`;
            div.dataset.index = i;
            div.style.left = (20 + (Math.floor(i / 6) * 100)) + 'px';
            div.style.top = (20 + (i % 6 * 110)) + 'px';
            div.innerHTML = `<div class="icon-img">${data.img}</div><div class="icon-name">${data.type === 'folder' ? '폴더' : '파일'} ${i+1}</div>`;
            
            // 이벤트 연결
            div.onclick = (e) => handleIconClick(e, div);
            div.ondblclick = () => handleIconDblClick(div);
            div.oncontextmenu = (e) => handleIconRightClick(e, div);
            setupDragAndDrop(div);

            desktop.appendChild(div);
        });
    }

    function showSuccess() {
        successMsg.style.display = 'block';
        setTimeout(() => successMsg.style.display = 'none', 1500);
    }

    // 모드 설정
    function setMode(mode) {
        currentMode = mode;
        selectedIcons.clear();
        zoomLevel = 1.0;
        createIcons();
        textScreen.style.display = 'none';
        contextMenu.style.display = 'none';
        document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        switch(mode) {
            case 'click': instruction.innerText = "마우스 왼쪽 버튼으로 아무 폴더나 파일을 한 번 눌러보세요."; break;
            case 'double': instruction.innerText = "빠르게 두 번(더블 클릭) 눌러서 항목을 실행해 보세요."; break;
            case 'right': instruction.innerText = "항목 위에 마우스 오른쪽 버튼을 눌러 메뉴를 띄워보세요."; break;
            case 'drag': instruction.innerText = "파일을 꾹 눌러서 다른 '폴더' 위로 끌어다 놓으세요."; break;
            case 'scroll': 
                instruction.innerText = "휠을 굴려 문서의 맨 아래까지 내려가보세요.";
                setupScrollScreen();
                break;
            case 'ctrl-click': instruction.innerText = "Ctrl 키를 누른 상태로 파일 3개를 각각 클릭해 보세요."; break;
            case 'shift-click': instruction.innerText = "첫 번째 파일을 누르고, Shift 키를 누른 채 마지막 파일을 눌러보세요."; break;
            case 'ctrl-drag': instruction.innerText = "Ctrl 키를 누른 상태로 빈 공간을 드래그하여 3개 이상의 파일을 감싸보세요."; setupMarquee(); break;
            case 'alt-drag': instruction.innerText = "Alt 키를 누른 채 파일을 옆으로 드래그해 보세요. 바로가기가 생깁니다."; break;
            case 'ctrl-wheel': 
                instruction.innerText = "Ctrl 키를 누른 채 휠을 위아래로 굴려 글자를 확대/축소해 보세요.";
                setupScrollScreen();
                break;
        }
    }

    // --- 액션 핸들러들 ---

    function handleIconClick(e, el) {
        if (currentMode === 'click') showSuccess();
        
        if (currentMode === 'ctrl-click' && keys.ctrl) {
            el.classList.toggle('selected');
            if (el.classList.contains('selected')) selectedIcons.add(el);
            else selectedIcons.delete(el);
            if (selectedIcons.size >= 3) showSuccess();
        }

        if (currentMode === 'shift-click' && keys.shift) {
            const icons = Array.from(document.querySelectorAll('.icon'));
            const lastIdx = parseInt(el.dataset.index);
            icons.forEach(icon => {
                const idx = parseInt(icon.dataset.index);
                if (idx <= lastIdx) icon.classList.add('selected');
            });
            showSuccess();
        }
    }

    function handleIconDblClick(el) {
        if (currentMode === 'double') showSuccess();
    }

    function handleIconRightClick(e, el) {
        e.preventDefault();
        if (currentMode === 'right') {
            contextMenu.style.display = 'block';
            contextMenu.style.left = (e.clientX - desktop.getBoundingClientRect().left) + 'px';
            contextMenu.style.top = (e.clientY - desktop.getBoundingClientRect().top) + 'px';
            showSuccess();
        }
    }

    function onMenuClick() { contextMenu.style.display = 'none'; }

    function setupDragAndDrop(el) {
        let isDragging = false;
        let startX, startY;

        el.onmousedown = (e) => {
            if (e.button !== 0) return;
            isDragging = true;
            startX = e.clientX - el.offsetLeft;
            startY = e.clientY - el.offsetTop;
            el.style.zIndex = 100;
        };

        window.onmousemove = (e) => {
            if (!isDragging) return;
            const x = e.clientX - startX;
            const y = e.clientY - startY;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
        };

        window.onmouseup = (e) => {
            if (!isDragging) return;
            isDragging = false;

            // Alt 드래그 체크
            if (currentMode === 'alt-drag' && keys.alt) {
                const clone = el.cloneNode(true);
                clone.classList.add('shortcut-badge');
                clone.querySelector('.icon-name').innerText += " - 바로가기";
                desktop.appendChild(clone);
                showSuccess();
            }

            // 드래그 앤 드롭 체크
            if (currentMode === 'drag') {
                const folders = document.querySelectorAll('.folder');
                folders.forEach(f => {
                    if (f === el) return;
                    const rect1 = el.getBoundingClientRect();
                    const rect2 = f.getBoundingClientRect();
                    if (!(rect1.right < rect2.left || rect1.left > rect2.right || rect1.bottom < rect2.top || rect1.top > rect2.bottom)) {
                        el.style.display = 'none';
                        showSuccess();
                    }
                });
            }
        };
    }

    function setupScrollScreen() {
        const screen = document.getElementById('text-screen');
        screen.style.display = 'block';
        screen.innerHTML = `<h1>📜 연습용 문서</h1>` + `<p style="font-size: 24px;">내용을 확인하려면 아래로 스크롤하세요...</p>`.repeat(50) + `<h2 id="end-mark" style="color:red">문서의 끝입니다! 성공!</h2>`;
        
        screen.onscroll = () => {
            if (currentMode === 'scroll' && screen.scrollTop + screen.clientHeight >= screen.scrollHeight - 10) {
                showSuccess();
            }
        };

        screen.onwheel = (e) => {
            if (currentMode === 'ctrl-wheel' && keys.ctrl) {
                e.preventDefault();
                if (e.deltaY < 0) zoomLevel += 0.1;
                else zoomLevel -= 0.1;
                zoomLevel = Math.max(0.5, Math.min(3, zoomLevel));
                screen.style.fontSize = (zoomLevel * 100) + '%';
                showSuccess();
            }
        };
    }

    function setupMarquee() {
        let isDrawing = false;
        let x1, y1;

        desktop.onmousedown = (e) => {
            if (currentMode !== 'ctrl-drag' || !keys.ctrl || e.target !== desktop) return;
            isDrawing = true;
            x1 = e.clientX - desktop.offsetLeft;
            y1 = e.clientY - desktop.offsetTop;
            selectionBox.style.display = 'block';
        };

        window.onmousemove = (e) => {
            if (!isDrawing) return;
            let x2 = e.clientX - desktop.offsetLeft;
            let y2 = e.clientY - desktop.offsetTop;
            
            selectionBox.style.left = Math.min(x1, x2) + 'px';
            selectionBox.style.top = Math.min(y1, y2) + 'px';
            selectionBox.style.width = Math.abs(x2 - x1) + 'px';
            selectionBox.style.height = Math.abs(y2 - y1) + 'px';

            // 선택 감지
            const box = selectionBox.getBoundingClientRect();
            let count = 0;
            document.querySelectorAll('.icon').forEach(icon => {
                const r = icon.getBoundingClientRect();
                if (!(r.right < box.left || r.left > box.right || r.bottom < box.top || r.top > box.bottom)) {
                    icon.classList.add('selected');
                    count++;
                } else {
                    icon.classList.remove('selected');
                }
            });
            if (count >= 3) showSuccess();
        };

        window.onmouseup = () => {
            isDrawing = false;
            selectionBox.style.display = 'none';
        };
    }

    // 바탕 클릭 시 우클릭 메뉴 닫기
    document.addEventListener('click', (e) => {
        if (!contextMenu.contains(e.target)) contextMenu.style.display = 'none';
    });

    // 앱 시작 시 초기 클릭 모드 활성화
    setMode('click');
</script>

</body>
</html>
