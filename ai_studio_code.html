<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시니어 마우스 & 키보드 마스터</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --primary-color: #0056b3;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --text-main: #212529;
            --sidebar-bg: #343a40;
        }

        body, html {
            margin: 0; padding: 0;
            font-family: 'Malgun Gothic', sans-serif;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        /* 레이아웃 */
        .container {
            display: flex;
            height: 100vh;
        }

        /* 사이드바 메뉴 */
        nav {
            width: 300px;
            background-color: var(--sidebar-bg);
            color: white;
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 5px rgba(0,0,0,0.2);
            z-index: 10;
        }

        .nav-header {
            padding: 20px;
            background-color: #1a1e21;
            text-align: center;
        }

        .nav-header h2 { margin: 0; font-size: 22px; color: #ffc107; }

        .menu-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .menu-section {
            margin-bottom: 20px;
        }

        .menu-section h3 {
            font-size: 16px;
            color: #adb5bd;
            border-bottom: 1px solid #495057;
            padding-bottom: 5px;
            margin-left: 10px;
        }

        .menu-item {
            width: 100%;
            padding: 15px;
            background: none;
            border: none;
            color: #e9ecef;
            text-align: left;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.2s;
            margin-bottom: 5px;
        }

        .menu-item:hover { background-color: #495057; }
        .menu-item.active { background-color: var(--primary-color); color: white; font-weight: bold; }

        /* 메인 연습 영역 */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #instruction-bar {
            background-color: white;
            padding: 20px 40px;
            border-bottom: 2px solid #dee2e6;
            min-height: 80px;
        }

        #instruction-bar h2 { margin: 0 0 10px 0; color: var(--primary-color); }
        #instruction-bar p { margin: 0; font-size: 20px; line-height: 1.5; font-weight: bold; }

        #sandbox {
            flex: 1;
            margin: 20px;
            background-color: #fff;
            border: 3px solid #dee2e6;
            border-radius: 15px;
            position: relative;
            overflow: hidden;
            background-image: radial-gradient(#d1d1d1 1px, transparent 1px);
            background-size: 40px 40px; /* 그리드 배경 */
        }

        /* 오브젝트 디자인 */
        .obj {
            position: absolute;
            user-select: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .folder {
            width: 100px;
            height: 100px;
        }
        .folder-icon {
            font-size: 60px;
            color: #ffca28;
        }
        .obj-label {
            margin-top: 5px;
            font-weight: bold;
            font-size: 14px;
            background: rgba(255,255,255,0.8);
            padding: 2px 5px;
            border-radius: 4px;
        }

        .target-btn {
            padding: 20px 40px;
            font-size: 24px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 12px;
            border: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 상태바 */
        #status-bar {
            height: 60px;
            background: white;
            border-top: 1px solid #ccc;
            display: flex;
            align-items: center;
            padding: 0 30px;
            gap: 20px;
        }

        .key-badge {
            padding: 8px 20px;
            background: #e9ecef;
            border: 2px solid #adb5bd;
            border-radius: 8px;
            font-weight: bold;
            font-size: 18px;
            color: #adb5bd;
        }

        .key-badge.on {
            background: var(--danger-color);
            color: white;
            border-color: #a71d2a;
            transform: translateY(-2px);
            box-shadow: 0 4px 0 #a71d2a;
        }

        /* 우클릭 메뉴 커스텀 */
        #custom-menu {
            position: absolute;
            display: none;
            background: white;
            border: 1px solid #ccc;
            box-shadow: 5px 5px 15px rgba(0,0,0,0.2);
            padding: 10px 0;
            z-index: 100;
            min-width: 150px;
        }
        .menu-opt {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
        }
        .menu-opt:hover { background: #f0f0f0; }

        /* 성공 피드백 */
        #success-msg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(40, 167, 69, 0.9);
            color: white;
            padding: 30px 60px;
            border-radius: 50px;
            font-size: 32px;
            font-weight: bold;
            display: none;
            z-index: 500;
            pointer-events: none;
        }

        .selected {
            outline: 3px solid var(--primary-color);
            background-color: rgba(0, 86, 179, 0.1);
        }

        .copy-effect { opacity: 0.7; transform: translate(10px, 10px); }
        .shortcut-icon::after { content: '⤴'; position: absolute; left: 0; bottom: 20px; background: white; border: 1px solid black; font-size: 12px; }

    </style>
</head>
<body>

<div class="container">
    <nav>
        <div class="nav-header">
            <h2>기초 컨트롤 연습</h2>
        </div>
        <div class="menu-list">
            <div class="menu-section">
                <h3>마우스 기본</h3>
                <button class="menu-item" onclick="initExercise('click')">🖱️ 클릭</button>
                <button class="menu-item" onclick="initExercise('double')">🖱️ 더블 클릭</button>
                <button class="menu-item" onclick="initExercise('right')">🖱️ 우클릭</button>
                <button class="menu-item" onclick="initExercise('drag')">🖱️ 드래그 앤 드롭</button>
                <button class="menu-item" onclick="initExercise('scroll')">🖱️ 스크롤</button>
                <button class="menu-item" onclick="initExercise('hover')">🖱️ 마우스 오버</button>
            </div>
            <div class="menu-section">
                <h3>키보드 조합</h3>
                <button class="menu-item" onclick="initExercise('ctrl-click')">⌨️ Ctrl + 클릭</button>
                <button class="menu-item" onclick="initExercise('shift-click')">⌨️ Shift + 클릭</button>
                <button class="menu-item" onclick="initExercise('ctrl-drag')">⌨️ Ctrl + 드래그</button>
                <button class="menu-item" onclick="initExercise('alt-drag')">⌨️ Alt + 드래그</button>
                <button class="menu-item" onclick="initExercise('ctrl-wheel')">⌨️ Ctrl + 휠</button>
            </div>
        </div>
    </nav>

    <main>
        <div id="instruction-bar">
            <h2 id="ex-title">환영합니다!</h2>
            <p id="ex-desc">왼쪽 메뉴에서 연습할 항목을 선택해주세요.</p>
        </div>

        <div id="sandbox">
            <div id="start-screen" style="text-align: center; margin-top: 100px;">
                <h1 style="font-size: 50px;">👈</h1>
                <p style="font-size: 24px;">왼쪽의 메뉴를 눌러 연습을 시작하세요.</p>
            </div>
        </div>

        <div id="status-bar">
            <span style="font-weight: bold; font-size: 20px; margin-right: 10px;">키보드 상태:</span>
            <div id="key-ctrl" class="key-badge">Ctrl</div>
            <div id="key-shift" class="key-badge">Shift</div>
            <div id="key-alt" class="key-badge">Alt</div>
        </div>

        <div id="success-msg">참 잘하셨습니다! 👍</div>
        <div id="custom-menu">
            <div class="menu-opt" onclick="completeEx('복사 완료!')">복사</div>
            <div class="menu-opt" onclick="completeEx('삭제 완료!')">삭제</div>
            <div class="menu-opt" onclick="completeEx('이름 바꾸기')">이름 바꾸기</div>
        </div>
    </main>
</div>

<script>
    const sandbox = document.getElementById('sandbox');
    const title = document.getElementById('ex-title');
    const desc = document.getElementById('ex-desc');
    const successMsg = document.getElementById('success-msg');
    const customMenu = document.getElementById('custom-menu');

    let keys = { ctrl: false, shift: false, alt: false };

    // 키보드 상태 감지
    window.addEventListener('keydown', (e) => {
        if(e.key === 'Control') { keys.ctrl = true; document.getElementById('key-ctrl').classList.add('on'); }
        if(e.key === 'Shift') { keys.shift = true; document.getElementById('key-shift').classList.add('on'); }
        if(e.key === 'Alt') { keys.alt = true; document.getElementById('key-alt').classList.add('on'); }
    });

    window.addEventListener('keyup', (e) => {
        if(e.key === 'Control') { keys.ctrl = false; document.getElementById('key-ctrl').classList.remove('on'); }
        if(e.key === 'Shift') { keys.shift = false; document.getElementById('key-shift').classList.remove('on'); }
        if(e.key === 'Alt') { keys.alt = false; document.getElementById('key-alt').classList.remove('on'); }
    });

    function completeEx(text = "참 잘하셨습니다!") {
        successMsg.innerText = text;
        successMsg.style.display = 'block';
        setTimeout(() => { successMsg.style.display = 'none'; }, 1500);
    }

    function clearSandbox() {
        sandbox.innerHTML = '';
        sandbox.onmousedown = null;
        sandbox.onwheel = null;
        sandbox.oncontextmenu = (e) => e.preventDefault();
        customMenu.style.display = 'none';
        document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
    }

    function createObj(type, name, x, y) {
        const div = document.createElement('div');
        div.className = 'obj ' + type;
        div.style.left = x + 'px';
        div.style.top = y + 'px';
        
        let icon = '📄';
        if(type === 'folder') icon = '📁';
        if(type === 'image') icon = '🖼️';
        
        div.innerHTML = `<span class="folder-icon">${icon}</span><span class="obj-label">${name}</span>`;
        return div;
    }

    function initExercise(type) {
        clearSandbox();
        event.currentTarget.classList.add('active');

        switch(type) {
            case 'click':
                title.innerText = "클릭 (좌클릭)";
                desc.innerText = "가운데 나타난 버튼을 마우스 왼쪽 버튼으로 한 번 눌러보세요.";
                const btn = document.createElement('button');
                btn.className = 'target-btn obj';
                btn.innerText = "나를 클릭하세요";
                btn.style.left = '40%'; btn.style.top = '40%';
                btn.onclick = () => completeEx();
                sandbox.appendChild(btn);
                break;

            case 'double':
                title.innerText = "더블 클릭";
                desc.innerText = "폴더를 빠르게 두 번 연속으로 눌러서 열어보세요.";
                const f = createObj('folder', '내 사진', 350, 150);
                f.ondblclick = () => completeEx("폴더가 열렸습니다!");
                sandbox.appendChild(f);
                break;

            case 'right':
                title.innerText = "우클릭 (오른쪽 버튼)";
                desc.innerText = "폴더 위에 마우스 오른쪽 버튼을 눌러 추가 메뉴를 열어보세요.";
                const rf = createObj('folder', '중요 문서', 350, 150);
                rf.oncontextmenu = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    customMenu.style.display = 'block';
                    customMenu.style.left = (e.clientX - 300) + 'px';
                    customMenu.style.top = (e.clientY - 120) + 'px';
                };
                sandbox.appendChild(rf);
                break;

            case 'drag':
                title.innerText = "드래그 앤 드롭";
                desc.innerText = "파일을 마우스로 꾹 누른 채 옆으로 끌어서 옮겨보세요.";
                const df = createObj('image', '풍경 사진', 100, 150);
                setupDrag(df);
                sandbox.appendChild(df);
                break;

            case 'scroll':
                title.innerText = "스크롤 (휠)";
                desc.innerText = "마우스 가운데 휠을 위아래로 굴려 글을 읽어보세요.";
                const sDiv = document.createElement('div');
                sDiv.style.padding = '30px';
                sDiv.style.fontSize = '24px';
                sDiv.style.height = '100%';
                sDiv.style.overflowY = 'scroll';
                sDiv.innerHTML = "휠을 아래로 굴리세요...<br><br>".repeat(30) + "<h1 style='color:red'>끝까지 보셨네요! 성공!</h1>";
                sDiv.onscroll = () => {
                    if(sDiv.scrollTop + sDiv.clientHeight >= sDiv.scrollHeight - 5) completeEx();
                }
                sandbox.appendChild(sDiv);
                break;

            case 'hover':
                title.innerText = "마우스 오버 (올려두기)";
                desc.innerText = "클릭하지 말고 마우스 화살표를 아이콘 위에 가만히 올려보세요.";
                const hf = createObj('folder', '마우스 올려봐요', 350, 150);
                hf.onmouseenter = () => {
                    const tip = document.createElement('div');
                    tip.id = "tooltip";
                    tip.innerText = "좋습니다! 이것이 '설명풍선'입니다.";
                    tip.style.position = 'absolute';
                    tip.style.background = 'black';
                    tip.style.color = 'white';
                    tip.style.padding = '10px';
                    tip.style.borderRadius = '5px';
                    hf.appendChild(tip);
                };
                hf.onmouseleave = () => {
                    const t = document.getElementById('tooltip');
                    if(t) t.remove();
                };
                sandbox.appendChild(hf);
                break;

            case 'ctrl-click':
                title.innerText = "Ctrl + 클릭 (개별 선택)";
                desc.innerText = "Ctrl 키를 누른 상태로 여러 개의 파일을 하나씩 선택해보세요.";
                for(let i=0; i<5; i++) {
                    const item = createObj('image', '사진 '+i, 50 + (i*140), 150);
                    item.onclick = () => {
                        if(keys.ctrl) {
                            item.classList.toggle('selected');
                            completeEx("여러 개가 선택됩니다!");
                        } else {
                            alert("Ctrl 키를 누르고 클릭해보세요!");
                        }
                    };
                    sandbox.appendChild(item);
                }
                break;

            case 'shift-click':
                title.innerText = "Shift + 클릭 (범위 선택)";
                desc.innerText = "1번을 클릭하고, Shift를 누른 채 5번을 클릭해 보세요.";
                let list = [];
                for(let i=0; i<5; i++) {
                    const item = createObj('image', (i+1)+'번 파일', 50 + (i*140), 150);
                    item.onclick = () => {
                        if(i===4 && keys.shift) {
                            list.forEach(el => el.classList.add('selected'));
                            completeEx("한 번에 다 선택되었습니다!");
                        } else {
                            list.forEach(el => el.classList.remove('selected'));
                            item.classList.add('selected');
                        }
                    };
                    list.push(item);
                    sandbox.appendChild(item);
                }
                break;

            case 'ctrl-drag':
                title.innerText = "Ctrl + 드래그 (복사)";
                desc.innerText = "Ctrl 키를 누른 채 파일을 옆으로 끌어보세요. 복사본이 생깁니다.";
                const cf = createObj('image', '원본 파일', 100, 150);
                setupDrag(cf, 'copy');
                sandbox.appendChild(cf);
                break;

            case 'alt-drag':
                title.innerText = "Alt + 드래그 (바로가기)";
                desc.innerText = "Alt 키를 누른 채 파일을 끌어보세요. 바로가기 화살표가 생깁니다.";
                const af = createObj('folder', '원본 폴더', 100, 150);
                setupDrag(af, 'shortcut');
                sandbox.appendChild(af);
                break;

            case 'ctrl-wheel':
                title.innerText = "Ctrl + 휠 (확대/축소)";
                desc.innerText = "Ctrl 키를 누른 상태에서 휠을 굴려 화면의 글자를 키워보세요.";
                const zText = document.createElement('div');
                zText.style.fontSize = '30px';
                zText.style.textAlign = 'center';
                zText.style.marginTop = '150px';
                zText.innerText = "글자 크기가 변합니다";
                let scale = 1;
                sandbox.onwheel = (e) => {
                    if(keys.ctrl) {
                        e.preventDefault();
                        if(e.deltaY < 0) scale += 0.1;
                        else scale -= 0.1;
                        zText.style.transform = `scale(${scale})`;
                        completeEx("화면 조절 중...");
                    }
                };
                sandbox.appendChild(zText);
                break;
        }
    }

    // 드래그 로직 공통
    function setupDrag(el, mode = 'move') {
        let isMoving = false;
        let offset = { x: 0, y: 0 };

        el.onmousedown = (e) => {
            isMoving = true;
            offset.x = e.clientX - el.offsetLeft;
            offset.y = e.clientY - el.offsetTop;
            
            if(mode === 'copy' && keys.ctrl) {
                const clone = el.cloneNode(true);
                clone.classList.add('copy-effect');
                sandbox.appendChild(clone);
                completeEx("복사본 생성!");
            }
            if(mode === 'shortcut' && keys.alt) {
                el.classList.add('shortcut-icon');
                completeEx("바로가기 만들기!");
            }
        };

        window.onmousemove = (e) => {
            if(!isMoving) return;
            el.style.left = (e.clientX - offset.x) + 'px';
            el.style.top = (e.clientY - offset.y) + 'px';
        };

        window.onmouseup = () => {
            isMoving = false;
        };
    }

    // 바탕 클릭 시 메뉴 닫기
    document.addEventListener('click', () => {
        customMenu.style.display = 'none';
    });

</script>
</body>
</html>
